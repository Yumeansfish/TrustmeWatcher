name: Project CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.TRUSTME_CI_TOKEN || github.token }}
          persist-credentials: false

      - name: Print locked submodule commits
        run: git submodule status --recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend check dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -e ./activitywatch/aw-core \
            -e ./activitywatch/aw-client
          python -m pip install -e ./trustme-xai
          python -m pip install flask==2.3.3 pytest ruff==0.8.6 -r backend/requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Run project checks
        run: scripts/check.sh

      - name: Fail if validation changed tracked files
        run: |
          git diff --exit-code --submodule=diff
          git submodule foreach --recursive 'git diff --exit-code'

  package-macos-arm64:
    name: Package unsigned macOS preview
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: integration
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: write
    concurrency:
      group: trustme-preview-build
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.TRUSTME_CI_TOKEN || github.token }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: arm64

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Check the native build toolchain
        run: |
          test "$(uname -m)" = arm64
          test "$(python -c 'import platform; print(platform.machine())')" = arm64
          swiftc --version
          xcrun --find codesign

      - name: Build the unsigned preview DMG
        env:
          APPLE_PERSONALID: ''
          DEVELOPER_ID_APPLICATION: ''
          DMG_PATH: ${{ github.workspace }}/build/dist/trust-me-macos-arm64-preview.dmg
          NOTARIZE: '0'
          RELEASE_VERSION: 0.0.${{ github.run_number }}
        run: make package

      - name: Write and verify the checksum
        working-directory: build/dist
        run: |
          shasum -a 256 trust-me-macos-arm64-preview.dmg > trust-me-macos-arm64-preview.dmg.sha256
          shasum -a 256 -c trust-me-macos-arm64-preview.dmg.sha256

      - name: Publish the rolling unsigned preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          current_main="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          if [[ "$current_main" != "$GITHUB_SHA" ]]; then
            echo "A newer main commit exists; skip publishing this older build."
            exit 0
          fi

          release_name="TrustmeWatcher unsigned preview"
          release_body="$(printf '%s\n\n%s\n%s\n\n%s\n%s\n%s\n' \
            'Automatic Apple Silicon preview build from the latest passing main commit.' \
            "Source commit: $GITHUB_SHA" \
            "Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            'This package is not signed with a Developer ID and is not notarized by Apple.' \
            'On first launch, macOS may require System Settings > Privacy & Security > Open Anyway.' \
            'Do not disable Gatekeeper globally.')"

          if gh release view preview >/dev/null 2>&1; then
            gh api --method PATCH \
              "repos/$GITHUB_REPOSITORY/git/refs/tags/preview" \
              -f sha="$GITHUB_SHA" \
              -F force=true >/dev/null
            gh release upload preview \
              build/dist/trust-me-macos-arm64-preview.dmg \
              build/dist/trust-me-macos-arm64-preview.dmg.sha256 \
              --clobber
          else
            gh release create preview \
              build/dist/trust-me-macos-arm64-preview.dmg \
              build/dist/trust-me-macos-arm64-preview.dmg.sha256 \
              --target "$GITHUB_SHA" \
              --title "$release_name" \
              --notes "$release_body" \
              --prerelease
          fi

          gh release edit preview \
            --title "$release_name" \
            --notes "$release_body" \
            --prerelease

          echo "Preview release updated: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/preview"

  package-windows-x64:
    name: Package unsigned Windows preview
    needs: integration
    permissions:
      contents: write
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.TRUSTME_CI_TOKEN || github.token }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Windows packaging tools
        shell: powershell
        run: choco install make innosetup -y --no-progress

      - name: Build the unsigned Windows installer
        env:
          RELEASE_VERSION: 0.0.${{ github.run_number }}
        run: make package-windows

      - name: Smoke-check the packaged server
        shell: powershell
        run: |
          $server = "build\bin\app\trust-me\aw-server\aw-server.exe"
          $version = & $server --version
          if ($LASTEXITCODE -ne 0) {
            throw "Packaged aw-server failed with exit code $LASTEXITCODE"
          }
          if ($version -ne "v0.0.${{ github.run_number }}") {
            throw "Unexpected packaged aw-server version: $version"
          }

      - name: Upload the Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: trust-me-windows-x86_64-preview
          path: |
            build/dist/trust-me-windows-x86_64-setup.exe
            build/dist/trust-me-windows-x86_64-setup.exe.sha256
          if-no-files-found: error

      - name: Publish Windows installer to preview release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current_main="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          if [[ "$current_main" != "$GITHUB_SHA" ]]; then
            echo "A newer main commit exists; skip publishing this older build."
            exit 0
          fi
          gh release upload preview \
            build/dist/trust-me-windows-x86_64-setup.exe \
            build/dist/trust-me-windows-x86_64-setup.exe.sha256 \
            --clobber
